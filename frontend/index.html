<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="login.title">NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=di2">
  <script>
    try {
      var t = localStorage.getItem('netatlas_theme');
      var theme = t === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    }
  </script>

</head>
<body>
  <div class="login-page">
    <section class="login-hero">
      <div class="hero-brand">
        <img src="/static/brand/netatlas-mark.svg" alt="NetAtlas" class="logo-mark">
        <h1>Net<span>Atlas</span></h1>
        <p class="tagline" data-i18n="login.tagline"></p>
      </div>
    </section>

    <section class="login-panel">
      <div id="login-lang"></div>
      <div class="login-form-wrap">
        <h2 data-i18n="login.heading"></h2>
        <p class="subtitle" data-i18n="login.subtitle"></p>
        <div id="login-error" class="alert-na error" style="display:none"></div>
        <form id="login-form" class="form-na">
          <div class="mb-3">
            <label for="username" data-i18n="login.username"></label>
            <input type="text" id="username" class="form-control" placeholder="operator" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label for="password" data-i18n="login.password"></label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn-na btn-na-primary w-100" id="login-btn" data-i18n="login.submit"></button>
        </form>
      </div>
    </section>
  </div>

  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/i18n.js?v=di2"></script>
  <script src="/js/api.js?v=di2"></script>
  <script src="/js/auth.js?v=di2"></script>
  <script>
    document.getElementById('login-lang').innerHTML = I18n.langSwitcherHtml('lang-switch--login');
    I18n.applyDom();
    I18n.bindLangSwitcher();

    if (Auth.redirectIfAuthenticated()) throw new Error('redirect');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = I18n.t('login.signing_in');
      try {
        await Auth.login(
          document.getElementById('username').value.trim(),
          document.getElementById('password').value
        );
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || I18n.t('login.auth_failed');
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = I18n.t('login.submit');
      }
    });
  </script>
</body>
</html>
