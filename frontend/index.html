<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas — Вход</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-page">
    <section class="login-hero">
      <div class="hero-brand">
        <img src="/static/brand/netatlas-mark.svg" alt="NetAtlas" class="logo-mark">
        <h1>Net<span>Atlas</span></h1>
        <p class="tagline">Цифровой атлас корпоративной инфраструктуры — топология, инвентарь и наблюдаемость в одном центре управления знаниями.</p>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-form-wrap">
        <h2>Доступ оператора</h2>
        <p class="subtitle">Войдите, чтобы открыть консоль сетевых операций.</p>
        <div id="login-error" class="alert-na error" style="display:none"></div>
        <form id="login-form" class="form-na">
          <div class="mb-3">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" class="form-control" placeholder="operator" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label for="password">Пароль</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn-na btn-na-primary w-100" id="login-btn">Войти</button>
        </form>
      </div>
    </section>
  </div>

  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (Auth.redirectIfAuthenticated()) throw new Error('redirect');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Вход…';
      try {
        await Auth.login(
          document.getElementById('username').value.trim(),
          document.getElementById('password').value
        );
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'Ошибка аутентификации';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
