<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Топология — NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=20260804ru">
</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/cytoscape/cytoscape.min.js"></script>
  <script src="/js/api.js?v=20260804ru"></script>
  <script src="/js/auth.js?v=20260804ru"></script>
  <script src="/js/topology.js?v=20260804ru"></script>
  <script src="/js/app.js?v=20260804ru"></script>
  <script>
    App.initShell('topology', 'Карта топологии', (el) => {
      el.classList.add('app-main--topology');
      el.innerHTML = `
        <div class="topology-toolbar">
          <button class="btn-na btn-na-secondary" id="btn-fit">Вписать</button>
          <button class="btn-na btn-na-secondary" id="btn-relayout">Перестроить</button>
          <button class="btn-na btn-na-secondary" id="btn-refresh">Обновить</button>
        </div>
        <div id="topology-cy" class="topology-container topology-container--full"></div>
      `;

      Topology.init('topology-cy');

      document.getElementById('btn-fit').addEventListener('click', () => Topology.fit());
      document.getElementById('btn-relayout').addEventListener('click', () => Topology.relayout());
      document.getElementById('btn-refresh').addEventListener('click', () => Topology.init('topology-cy'));
    });
  </script>
</body>
</html>
