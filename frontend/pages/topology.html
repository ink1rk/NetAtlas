<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=i18n2">
</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/cytoscape/cytoscape.min.js"></script>
  <script src="/js/i18n.js?v=i18n2"></script>
  <script src="/js/api.js?v=i18n2"></script>
  <script src="/js/auth.js?v=i18n2"></script>
  <script src="/js/topology.js?v=i18n2"></script>
  <script src="/js/app.js?v=i18n2"></script>
  <script>
    App.initShell('topology', 'title.topology', (el) => {
      el.classList.add('app-main--topology');
      el.innerHTML = `
        <div class="topology-toolbar">
          <button class="btn-na btn-na-secondary" id="btn-fit">${I18n.t('topo.fit')}</button>
          <button class="btn-na btn-na-secondary" id="btn-relayout">${I18n.t('topo.relayout')}</button>
          <button class="btn-na btn-na-secondary" id="btn-refresh">${I18n.t('common.refresh')}</button>
        </div>
        <div id="topology-cy" class="topology-container topology-container--full"></div>
      `;
      Topology.init('topology-cy');
      document.getElementById('btn-fit').addEventListener('click', () => Topology.fit());
      document.getElementById('btn-relayout').addEventListener('click', () => Topology.relayout());
      document.getElementById('btn-refresh').addEventListener('click', () => Topology.init('topology-cy'));
    });
  </script>
</body>
</html>
