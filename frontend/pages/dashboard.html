<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas NOC</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=noc1">
  <script>
    try {
      var t = localStorage.getItem('netatlas_theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/cytoscape/cytoscape.min.js"></script>
  <script src="/js/i18n.js?v=noc1"></script>
  <script src="/js/api.js?v=noc1"></script>
  <script src="/js/auth.js?v=noc1"></script>
  <script src="/js/topology.js?v=noc1"></script>
  <script src="/js/ui.js?v=noc1"></script>
  <script src="/js/noc.js?v=noc1"></script>
  <script src="/js/app.js?v=noc1"></script>
  <script>
    const ws = App.queryParam('ws') || 'network';
    const titleKey = ({
      network: 'ws.network',
      cable: 'ws.cable',
      inventory: 'ws.inventory',
      ipam: 'ws.ipam',
      monitoring: 'ws.monitoring',
      snapshots: 'ws.snapshots',
      backups: 'ws.backups',
    })[ws] || 'ws.network';
    App.initNocShell(ws, titleKey);
  </script>
</body>
</html>
