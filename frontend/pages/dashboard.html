<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=i18n1">
</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/cytoscape/cytoscape.min.js"></script>
  <script src="/js/i18n.js?v=i18n1"></script>
  <script src="/js/api.js?v=i18n1"></script>
  <script src="/js/auth.js?v=i18n1"></script>
  <script src="/js/topology.js?v=i18n1"></script>
  <script src="/js/app.js?v=i18n1"></script>
  <script>
    App.initShell('dashboard', 'title.dashboard', async (el) => {
      el.innerHTML = `
        <div class="stat-grid" id="dash-stats">
          <div class="stat-block accent"><div class="stat-value">—</div><div class="stat-label">${I18n.t('dash.devices')}</div></div>
          <div class="stat-block"><div class="stat-value">—</div><div class="stat-label">${I18n.t('dash.links')}</div></div>
          <div class="stat-block"><div class="stat-value">—</div><div class="stat-label">${I18n.t('dash.prefixes')}</div></div>
          <div class="stat-block danger"><div class="stat-value">—</div><div class="stat-label">${I18n.t('dash.alerts')}</div></div>
        </div>
        <div class="panel panel-map">
          <div class="panel-header">
            <h3>${I18n.t('dash.live_map')}</h3>
            <a href="/pages/topology.html" class="btn-na btn-na-secondary">${I18n.t('dash.fullscreen')}</a>
          </div>
          <div class="panel-body"><div id="dash-map" class="dash-map-container"></div></div>
        </div>
        <div class="health-strip" id="health-strip">
          <span class="health-item">${I18n.t('dash.loading_health')}</span>
        </div>
      `;

      Topology.init('dash-map', { compact: true });

      try {
        const [devices, graph, prefixes, obsStatus, alerts] = await Promise.all([
          Api.listDevices({ page_size: 1 }),
          Api.topologyGraph(),
          Api.listPrefixes().catch(() => []),
          Api.get('/observability/status').catch(() => null),
          Api.get('/observability/alerts', { page_size: 1 }).catch(() => null),
        ]);

        const stats = el.querySelector('#dash-stats');
        stats.children[0].querySelector('.stat-value').textContent = devices.total ?? devices.items?.length ?? 0;
        stats.children[1].querySelector('.stat-value').textContent = (graph.edges || []).length;
        stats.children[2].querySelector('.stat-value').textContent = Array.isArray(prefixes) ? prefixes.length : 0;

        const alertCount = alerts?.total ?? obsStatus?.triggers_in_problem ?? 0;
        const alertBlock = stats.children[3];
        alertBlock.querySelector('.stat-value').textContent = alertCount;
        alertBlock.classList.toggle('danger', alertCount > 0);
        alertBlock.classList.toggle('accent', alertCount === 0);

        const strip = el.querySelector('#health-strip');
        const problems = obsStatus?.triggers_in_problem ?? 0;
        const events = obsStatus?.events_stored ?? 0;
        const syslogPort = obsStatus?.syslog?.udp_port;

        strip.innerHTML = `
          <span class="health-item ${problems > 0 ? 'health-problems' : 'health-ok'}">
            ${I18n.t('dash.trigger_problems', { n: problems })}
          </span>
          <span class="health-item">${I18n.t('dash.syslog_events', { n: events })}</span>
          ${syslogPort ? `<span class="health-item">Syslog UDP <span class="mono">:${App.escapeHtml(String(syslogPort))}</span></span>` : ''}
          <span class="health-item">${I18n.t('dash.nodes_mapped', { n: (graph.nodes || []).length })}</span>
          <a href="/pages/observability.html" class="btn-na btn-na-secondary btn-sm">${I18n.t('dash.observability')}</a>
        `;
      } catch (err) {
        const strip = el.querySelector('#health-strip');
        if (strip) strip.innerHTML = `<span class="health-item" style="color:var(--na-critical)">${App.escapeHtml(err.message)}</span>`;
      }
    });
  </script>
</body>
</html>
