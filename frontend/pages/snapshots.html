<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=mon2">
  <script>
    try {
      var t = localStorage.getItem('netatlas_theme');
      var theme = t === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    }
  </script>

</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/i18n.js?v=mon2"></script>
  <script src="/js/api.js?v=mon2"></script>
  <script src="/js/auth.js?v=mon2"></script>
<script src="/js/ui.js?v=mon2"></script>
  <script src="/js/app.js?v=mon2"></script>
  <script>
    App.initShell('snapshots', 'title.snapshots', (el) => {
      el.innerHTML = `
        <div class="panel mb-3">
          <div class="panel-header"><h3>${I18n.t('snap.archive')}</h3></div>
          <div class="panel-body p-0" id="snapshots-list"><p class="empty-state">${I18n.t('common.loading')}</p></div>
        </div>
        <div class="panel">
          <div class="panel-header"><h3>${I18n.t('snap.compare')}</h3></div>
          <div class="panel-body">
            <div class="row g-3 mb-3">
              <div class="col-md-5">
                <label class="form-na"><span>${I18n.t('snap.left')}</span>
                  <select id="diff-left" class="form-select"></select>
                </label>
              </div>
              <div class="col-md-5">
                <label class="form-na"><span>${I18n.t('snap.right')}</span>
                  <select id="diff-right" class="form-select"></select>
                </label>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button class="btn-na btn-na-primary w-100" id="btn-diff">${I18n.t('snap.compare_btn')}</button>
              </div>
            </div>
            <div id="diff-result"></div>
          </div>
        </div>
      `;
      loadSnapshots();
      document.getElementById('btn-diff').addEventListener('click', runDiff);
    });

    let snapshots = [];

    async function loadSnapshots() {
      const el = document.getElementById('snapshots-list');
      try {
        snapshots = await Api.listSnapshots();
        const opts = snapshots.map(s =>
          `<option value="${s.id}">${App.escapeHtml(s.label || s.id?.slice(0, 8))} — ${App.formatDate(s.created_at)}</option>`
        ).join('');
        document.getElementById('diff-left').innerHTML = opts;
        document.getElementById('diff-right').innerHTML = opts;
        if (!snapshots.length) {
          el.innerHTML = `<p class="empty-state">${I18n.t('snap.empty')}</p>`;
          return;
        }
        el.innerHTML = `<table class="data-table"><thead><tr>
          <th>${I18n.t('snap.label')}</th><th>${I18n.t('snap.created')}</th><th>${I18n.t('snap.checksum')}</th><th>${I18n.t('snap.summary')}</th>
        </tr></thead><tbody>${snapshots.map(s => `<tr>
          <td><strong>${App.escapeHtml(s.label)}</strong></td>
          <td>${App.formatDate(s.created_at)}</td>
          <td class="mono">${App.escapeHtml(s.checksum?.slice(0, 12))}…</td>
          <td class="mono">${s.summary ? JSON.stringify(s.summary) : '—'}</td>
        </tr>`).join('')}</tbody></table>`;
      } catch (err) { el.innerHTML = `<div class="alert-na error m-3">${App.escapeHtml(err.message)}</div>`; }
    }

    async function runDiff() {
      const result = document.getElementById('diff-result');
      const left = document.getElementById('diff-left').value;
      const right = document.getElementById('diff-right').value;
      if (!left || !right) { alert(I18n.t('snap.select_two')); return; }
      result.innerHTML = `<p class="empty-state">${I18n.t('snap.computing')}</p>`;
      try {
        const diff = await Api.diffSnapshots(left, right);
        result.innerHTML = `<div class="diff-columns">
          <div class="diff-col added">
            <h4>${I18n.t('snap.added', { n: (diff.added || []).length })}</h4>
            ${(diff.added || []).map(i => `<div class="diff-item">${App.escapeHtml(JSON.stringify(i))}</div>`).join('') || `<p class="text-muted">${I18n.t('common.none')}</p>`}
          </div>
          <div class="diff-col removed">
            <h4>${I18n.t('snap.removed', { n: (diff.removed || []).length })}</h4>
            ${(diff.removed || []).map(i => `<div class="diff-item">${App.escapeHtml(JSON.stringify(i))}</div>`).join('') || `<p class="text-muted">${I18n.t('common.none')}</p>`}
          </div>
          <div class="diff-col changed">
            <h4>${I18n.t('snap.changed', { n: (diff.changed || []).length })}</h4>
            ${(diff.changed || []).map(i => `<div class="diff-item">${App.escapeHtml(JSON.stringify(i))}</div>`).join('') || `<p class="text-muted">${I18n.t('common.none')}</p>`}
          </div>
        </div>`;
      } catch (err) {
        result.innerHTML = `<div class="alert-na error">${App.escapeHtml(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
