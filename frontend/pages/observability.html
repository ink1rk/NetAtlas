<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=mon2">
  <script>
    try {
      var t = localStorage.getItem('netatlas_theme');
      var theme = t === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    }
  </script>

</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/i18n.js?v=mon2"></script>
  <script src="/js/api.js?v=mon2"></script>
  <script src="/js/auth.js?v=mon2"></script>
<script src="/js/ui.js?v=mon2"></script>
  <script src="/js/app.js?v=mon2"></script>
  <script>
    App.initShell('observability', 'title.observability', async (el) => {
      el.innerHTML = `
        <div class="page-intro">
          <p class="subtitle">${I18n.t('obs.subtitle')}</p>
          <div class="pill-row" id="obs-status"></div>
        </div>
        <div class="panel mt-3">
          <div class="panel-header"><h3>${I18n.t('obs.create_trigger')}</h3></div>
          <div class="panel-body">
            <form id="trigger-form" class="row g-2 align-items-end">
              <div class="col-md-3">
                <label class="form-hint">${I18n.t('obs.name')}</label>
                <input class="form-control" id="tr-name" required placeholder="High CPU custom">
              </div>
              <div class="col-md-3">
                <label class="form-hint">${I18n.t('obs.metric')}</label>
                <select class="form-select" id="tr-metric"></select>
              </div>
              <div class="col-md-2">
                <label class="form-hint">${I18n.t('obs.operator')}</label>
                <select class="form-select" id="tr-op">
                  <option value="gt">&gt;</option>
                  <option value="gte">&gt;=</option>
                  <option value="lt">&lt;</option>
                  <option value="lte">&lt;=</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-hint">${I18n.t('obs.threshold')}</label>
                <input class="form-control" id="tr-threshold" type="number" value="90" required>
              </div>
              <div class="col-md-2">
                <button class="btn-na btn-na-primary w-100" type="submit">${I18n.t('obs.create_trigger')}</button>
              </div>
            </form>
          </div>
        </div>
        <div class="panel mt-3">
          <div class="panel-header"><h3>${I18n.t('obs.triggers')}</h3></div>
          <div class="panel-body table-wrap">
            <table class="table-na">
              <thead><tr><th>${I18n.t('obs.name')}</th><th>${I18n.t('obs.kind')}</th><th>${I18n.t('common.severity')}</th><th>${I18n.t('common.status')}</th><th>${I18n.t('obs.last_value')}</th><th>${I18n.t('obs.changed')}</th></tr></thead>
              <tbody id="triggers-body"><tr><td colspan="6">${I18n.t('common.loading')}</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="panel mt-3">
          <div class="panel-header"><h3>${I18n.t('obs.recent_alerts')}</h3></div>
          <div class="panel-body table-wrap">
            <table class="table-na">
              <thead><tr><th>${I18n.t('obs.type')}</th><th>${I18n.t('common.severity')}</th><th>${I18n.t('common.message')}</th><th>${I18n.t('obs.ack')}</th><th>${I18n.t('common.time')}</th><th></th></tr></thead>
              <tbody id="alerts-body"><tr><td colspan="6">${I18n.t('common.loading')}</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="panel mt-3">
          <div class="panel-header">
            <h3>${I18n.t('obs.events')}</h3>
            <form id="event-filter" class="inline-form">
              <input class="form-control" id="q" placeholder="${I18n.t('obs.search_msg')}">
              <select class="form-select" id="category">
                <option value="">${I18n.t('obs.all_categories')}</option>
                <option>auth_failure</option>
                <option>firewall</option>
                <option>link_down</option>
                <option>threat</option>
                <option>syslog</option>
              </select>
              <button class="btn-na btn-na-secondary" type="submit">${I18n.t('common.filter')}</button>
            </form>
          </div>
          <div class="panel-body table-wrap">
            <table class="table-na">
              <thead><tr><th>${I18n.t('common.time')}</th><th>${I18n.t('common.source')}</th><th>${I18n.t('obs.sev')}</th><th>${I18n.t('obs.category')}</th><th>${I18n.t('common.message')}</th></tr></thead>
              <tbody id="events-body"><tr><td colspan="5">${I18n.t('common.loading')}</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="panel mt-3">
          <div class="panel-header"><h3>${I18n.t('obs.siem')}</h3></div>
          <div class="panel-body table-wrap">
            <table class="table-na">
              <thead><tr><th>${I18n.t('obs.rule')}</th><th>${I18n.t('obs.hit_title')}</th><th>${I18n.t('common.severity')}</th><th>${I18n.t('common.source')}</th><th>${I18n.t('common.time')}</th></tr></thead>
              <tbody id="siem-body"><tr><td colspan="5">${I18n.t('common.loading')}</td></tr></tbody>
            </table>
          </div>
        </div>
      `;

      async function loadStatus() {
        const s = await Api.get('/observability/status');
        document.getElementById('obs-status').innerHTML = `
          <span class="pill">syslog :${App.escapeHtml(String(s.syslog.udp_port))}/udp</span>
          ${s.syslog.tls_enabled ? `<span class="pill">syslog-tls :${App.escapeHtml(String(s.syslog.tls_port))}</span>` : ''}
          <span class="pill ${s.channels?.smtp ? '' : 'pill-dim'}">SMTP ${s.channels?.smtp ? I18n.t('obs.on') : I18n.t('obs.off')}</span>
          <span class="pill ${s.channels?.telegram ? '' : 'pill-dim'}">Telegram ${s.channels?.telegram ? I18n.t('obs.on') : I18n.t('obs.off')}</span>
          <span class="pill ${s.channels?.element ? '' : 'pill-dim'}">Element ${s.channels?.element ? I18n.t('obs.on') : I18n.t('obs.off')}</span>
          <span class="pill">${I18n.t('obs.events_count', { n: s.events_stored })}</span>
          <span class="pill ${s.triggers_in_problem ? 'pill-warn' : ''}">${I18n.t('obs.problems_count', { n: s.triggers_in_problem })}</span>
        `;
      }

      async function loadTriggers() {
        const rows = await Api.get('/observability/triggers');
        const body = document.getElementById('triggers-body');
        if (!rows.length) { body.innerHTML = `<tr><td colspan="6">${I18n.t('obs.no_triggers')}</td></tr>`; return; }
        body.innerHTML = rows.map(t => `
          <tr>
            <td>${App.escapeHtml(t.name)}</td>
            <td><code>${App.escapeHtml(t.kind)}</code></td>
            <td>${App.escapeHtml(t.severity)}</td>
            <td>${App.statusBadge(t.status)}</td>
            <td><code>${App.escapeHtml(t.last_value || '—')}</code></td>
            <td>${App.formatDate(t.last_change_at)}</td>
          </tr>
        `).join('');
      }

      async function loadAlerts() {
        const data = await Api.get('/observability/alerts?page_size=30');
        const body = document.getElementById('alerts-body');
        if (!data.items.length) { body.innerHTML = `<tr><td colspan="6">${I18n.t('obs.no_alerts')}</td></tr>`; return; }
        body.innerHTML = data.items.map(a => `
          <tr>
            <td>${App.escapeHtml(a.event_type)}</td>
            <td>${App.escapeHtml(a.severity)}</td>
            <td>${App.escapeHtml(a.message)}</td>
            <td>${a.acknowledged ? I18n.t('common.yes') : I18n.t('common.no')}</td>
            <td>${App.formatDate(a.created_at)}</td>
            <td>${a.acknowledged ? '' : `<button class="btn-na btn-na-secondary btn-sm" data-ack="${a.id}">${I18n.t('obs.ack_btn')}</button>`}</td>
          </tr>
        `).join('');
        body.querySelectorAll('[data-ack]').forEach(btn => {
          btn.addEventListener('click', async () => {
            await Api.post(`/observability/alerts/${btn.dataset.ack}/ack`);
            loadAlerts();
          });
        });
      }

      async function loadEvents(params = '') {
        const data = await Api.get('/observability/events?' + params);
        const body = document.getElementById('events-body');
        if (!data.items.length) { body.innerHTML = `<tr><td colspan="5">${I18n.t('obs.no_events')}</td></tr>`; return; }
        body.innerHTML = data.items.map(e => `
          <tr>
            <td>${App.formatDate(e.received_at)}</td>
            <td>${App.escapeHtml(e.source_ip || e.hostname || '—')}</td>
            <td>${e.severity ?? '—'}</td>
            <td>${App.escapeHtml(e.category)}</td>
            <td class="msg-cell">${App.escapeHtml(e.message)}</td>
          </tr>
        `).join('');
      }

      async function loadSiem() {
        const data = await Api.get('/observability/siem/hits');
        const body = document.getElementById('siem-body');
        if (!data.items.length) { body.innerHTML = `<tr><td colspan="5">${I18n.t('obs.no_siem')}</td></tr>`; return; }
        body.innerHTML = data.items.map(h => `
          <tr>
            <td>${App.escapeHtml(h.rule_name)}</td>
            <td>${App.escapeHtml(h.title)}</td>
            <td>${App.escapeHtml(h.severity)}</td>
            <td>${App.escapeHtml(h.source_ip || '—')}</td>
            <td>${App.formatDate(h.created_at)}</td>
          </tr>
        `).join('');
      }

      document.getElementById('event-filter').addEventListener('submit', (e) => {
        e.preventDefault();
        const q = document.getElementById('q').value.trim();
        const category = document.getElementById('category').value;
        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (category) params.set('category', category);
        loadEvents(params.toString());
      });

      try {
        const catalog = await Api.metricsCatalog();
        const sel = document.getElementById('tr-metric');
        sel.innerHTML = (catalog.items || []).map((m) =>
          `<option value="${App.escapeHtml(m.name)}">${App.escapeHtml(m.label || m.name)} (${App.escapeHtml(m.unit || '')})</option>`
        ).join('');
      } catch { /* optional */ }

      document.getElementById('trigger-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await Api.createTrigger({
            name: document.getElementById('tr-name').value.trim(),
            kind: 'metric_threshold',
            severity: 'warning',
            expression: {
              metric: document.getElementById('tr-metric').value,
              op: document.getElementById('tr-op').value,
              threshold: Number(document.getElementById('tr-threshold').value),
              for_minutes: 5,
            },
          });
          Ui.toast(I18n.t('obs.trigger_created'), 'ok');
          e.target.reset();
          loadTriggers();
        } catch (err) { Ui.toast(err.message, 'error'); }
      });

      await Promise.all([loadStatus(), loadTriggers(), loadAlerts(), loadEvents(), loadSiem()]);
    });
  </script>
</body>
</html>
