<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=snmp1">
  <script>
    try {
      var t = localStorage.getItem('netatlas_theme');
      var theme = t === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    }
  </script>
</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/i18n.js?v=snmp1"></script>
  <script src="/js/api.js?v=snmp1"></script>
  <script src="/js/auth.js?v=snmp1"></script>
  <script src="/js/ui.js?v=snmp1"></script>
  <script src="/js/app.js?v=snmp1"></script>
  <script>
    App.initShell('credentials', 'title.credentials', (el) => {
      el.innerHTML = `
        <div class="page-intro">
          <p class="subtitle">${I18n.t('cred.subtitle')}</p>
        </div>
        <div class="row g-3">
          <div class="col-lg-5">
            <div class="panel">
              <div class="panel-header"><h3>${I18n.t('cred.create')}</h3></div>
              <div class="panel-body">
                <form id="cred-form" class="form-na">
                  <div class="mb-2">
                    <label>${I18n.t('cred.name')}</label>
                    <input class="form-control" id="cred-name" required placeholder="SNMP-Core">
                  </div>
                  <div class="mb-2">
                    <label>${I18n.t('cred.protocol')}</label>
                    <select class="form-select" id="cred-protocol">
                      <option value="snmpv2">SNMPv2c</option>
                      <option value="snmpv3">SNMPv3</option>
                      <option value="ssh">SSH</option>
                    </select>
                  </div>
                  <div id="cred-fields"></div>
                  <button type="submit" class="btn-na btn-na-primary mt-2">${I18n.t('cred.create')}</button>
                </form>
              </div>
            </div>
            <div class="panel mt-3">
              <div class="panel-header"><h3>${I18n.t('cred.assign')}</h3></div>
              <div class="panel-body">
                <p class="form-hint mb-2">Выберите профиль и назначьте всем найденным устройствам для мониторинга.</p>
                <select class="form-select mb-2" id="assign-profile"></select>
                <button class="btn-na btn-na-secondary" id="btn-assign-all">${I18n.t('cred.assign_all')}</button>
                <button class="btn-na btn-na-primary ms-2" id="btn-collect">${I18n.t('cred.collect_now')}</button>
              </div>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="panel mb-3">
              <div class="panel-header"><h3>${I18n.t('cred.list')}</h3></div>
              <div class="panel-body p-0" id="cred-list"><p class="empty-state">${I18n.t('common.loading')}</p></div>
            </div>
            <div class="panel">
              <div class="panel-header"><h3>${I18n.t('cred.mib_catalog')}</h3></div>
              <div class="panel-body p-0" id="mib-catalog"><p class="empty-state">${I18n.t('common.loading')}</p></div>
            </div>
          </div>
        </div>
      `;

      const protocolEl = document.getElementById('cred-protocol');
      protocolEl.addEventListener('change', renderFields);
      renderFields();

      document.getElementById('cred-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const protocol = protocolEl.value;
          const secret = buildSecret(protocol);
          await Api.createCredential({
            name: document.getElementById('cred-name').value.trim(),
            protocol,
            secret,
          });
          Ui.toast(I18n.t('cred.created'), 'ok');
          e.target.reset();
          renderFields();
          loadCredentials();
        } catch (err) { Ui.toast(err.message, 'error'); }
      });

      document.getElementById('btn-assign-all').addEventListener('click', async () => {
        const id = document.getElementById('assign-profile').value;
        if (!id) return;
        try {
          const res = await Api.assignCredentials({ all_devices: true, credential_profile_ids: [id] });
          const seeds = res.seeds_updated != null ? `, ${res.seeds_updated} ${I18n.t('cred.seeds')}` : '';
          Ui.toast(`${I18n.t('cred.assign_ok')}: ${res.devices} ${I18n.t('cred.devices')}${seeds}`, 'ok');
        } catch (err) { Ui.toast(err.message, 'error'); }
      });

      document.getElementById('btn-collect').addEventListener('click', async () => {
        try {
          const res = await Api.collectMetricsNow();
          const enriched = res?.enriched != null ? ` · ${I18n.t('cred.enriched')}: ${res.enriched}` : '';
          Ui.toast(`${I18n.t('cred.collect_ok')}${enriched}`, 'ok');
        } catch (err) { Ui.toast(err.message, 'error'); }
      });

      loadCredentials();
      loadCatalog();
    });

    function renderFields() {
      const protocol = document.getElementById('cred-protocol').value;
      const box = document.getElementById('cred-fields');
      if (protocol === 'snmpv2') {
        box.innerHTML = `
          <div class="mb-2"><label>${I18n.t('cred.community')}</label>
            <input class="form-control" id="cred-community" value="public" required></div>`;
      } else if (protocol === 'snmpv3') {
        box.innerHTML = `
          <div class="mb-2"><label>${I18n.t('cred.username')}</label>
            <input class="form-control" id="cred-username" required></div>
          <div class="mb-2"><label>${I18n.t('cred.auth_key')}</label>
            <input class="form-control" id="cred-auth" type="password" required></div>
          <div class="mb-2"><label>${I18n.t('cred.priv_key')}</label>
            <input class="form-control" id="cred-priv" type="password"></div>`;
      } else {
        box.innerHTML = `
          <div class="mb-2"><label>${I18n.t('cred.username')}</label>
            <input class="form-control" id="cred-username" required></div>
          <div class="mb-2"><label>${I18n.t('cred.password')}</label>
            <input class="form-control" id="cred-password" type="password"></div>`;
      }
    }

    function buildSecret(protocol) {
      if (protocol === 'snmpv2') {
        return { version: 2, community: document.getElementById('cred-community').value };
      }
      if (protocol === 'snmpv3') {
        return {
          version: 3,
          username: document.getElementById('cred-username').value,
          auth_key: document.getElementById('cred-auth').value,
          priv_key: document.getElementById('cred-priv').value || undefined,
        };
      }
      return {
        username: document.getElementById('cred-username').value,
        password: document.getElementById('cred-password').value || undefined,
      };
    }

    async function loadCredentials() {
      const el = document.getElementById('cred-list');
      const sel = document.getElementById('assign-profile');
      try {
        const rows = await Api.listCredentials();
        sel.innerHTML = rows.map((r) => `<option value="${r.id}">${App.escapeHtml(r.name)} (${App.escapeHtml(r.protocol)})</option>`).join('');
        if (!rows.length) {
          el.innerHTML = `<p class="empty-state p-3">${I18n.t('disc.cred_none')}</p>`;
          return;
        }
        el.innerHTML = `<table class="data-table"><thead><tr>
          <th>${I18n.t('cred.name')}</th><th>${I18n.t('cred.protocol')}</th><th></th>
        </tr></thead><tbody>${rows.map((r) => `<tr>
          <td>${App.escapeHtml(r.name)}</td>
          <td class="mono">${App.escapeHtml(r.protocol)}</td>
          <td><button class="btn-na btn-na-danger btn-sm" data-del="${r.id}">${I18n.t('common.remove')}</button></td>
        </tr>`).join('')}</tbody></table>`;
        el.querySelectorAll('[data-del]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm(I18n.t('disc.confirm_remove'))) return;
            try {
              await Api.deleteCredential(btn.dataset.del);
              Ui.toast(I18n.t('cred.deleted'), 'ok');
              loadCredentials();
            } catch (err) { Ui.toast(err.message, 'error'); }
          });
        });
      } catch (err) {
        el.innerHTML = `<div class="alert-na error m-3">${App.escapeHtml(err.message)}</div>`;
      }
    }

    async function loadCatalog() {
      const el = document.getElementById('mib-catalog');
      try {
        const data = await Api.metricsCatalog();
        const items = data.items || [];
        el.innerHTML = `<table class="data-table"><thead><tr>
          <th>Metric</th><th>MIB</th><th>OID</th><th>Unit</th>
        </tr></thead><tbody>${items.map((m) => `<tr>
          <td><strong class="mono">${App.escapeHtml(m.name)}</strong><div class="text-muted" style="font-size:11px">${App.escapeHtml(m.label || '')}</div></td>
          <td>${App.escapeHtml(m.mib || '')}</td>
          <td class="mono" style="font-size:11px">${App.escapeHtml(m.oid || '')}</td>
          <td>${App.escapeHtml(m.unit || '')}</td>
        </tr>`).join('')}</tbody></table>`;
      } catch (err) {
        el.innerHTML = `<div class="alert-na error m-3">${App.escapeHtml(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
