<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг — NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=20260804ru">
</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/chartjs/chart.umd.min.js"></script>
  <script src="/js/api.js?v=20260804ru"></script>
  <script src="/js/auth.js?v=20260804ru"></script>
  <script src="/js/charts.js?v=20260804ru"></script>
  <script src="/js/app.js?v=20260804ru"></script>
  <script>
    App.initShell('monitoring', 'Системный мониторинг', async (el) => {
      el.innerHTML = `
        <div class="stat-grid" id="sys-stats">
          <div class="stat-block accent"><div class="stat-value" id="health-status">—</div><div class="stat-label">Здоровье API</div></div>
          <div class="stat-block"><div class="stat-value" id="ready-status">—</div><div class="stat-label">Готовность</div></div>
          <div class="stat-block"><div class="stat-value" id="api-version">—</div><div class="stat-label">Версия</div></div>
          <div class="stat-block warning"><div class="stat-value" id="device-up">—</div><div class="stat-label">Устройства в сети</div></div>
        </div>
        <div class="row g-3">
          <div class="col-lg-6">
            <div class="panel">
              <div class="panel-header"><h3>Состояние устройств</h3></div>
              <div class="panel-body"><div class="chart-wrap tall"><canvas id="health-chart"></canvas></div></div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="panel">
              <div class="panel-header"><h3>Активность заданий обнаружения</h3></div>
              <div class="panel-body"><div class="chart-wrap tall"><canvas id="jobs-chart"></canvas></div></div>
            </div>
          </div>
        </div>
        <div class="panel mt-3">
          <div class="panel-header"><h3>Метрики устройств</h3></div>
          <div class="panel-body p-0" id="metrics-table"><p class="empty-state">Загрузка…</p></div>
        </div>
      `;

      try {
        const [health, ready, devices, jobs] = await Promise.all([
          Api.healthz().catch(() => ({ status: 'error' })),
          Api.readyz().catch(() => null),
          Api.listDevices({ page_size: 100 }),
          Api.listJobs(),
        ]);

        document.getElementById('health-status').innerHTML = health.status === 'ok'
          ? '<span class="badge-status up">OK</span>' : '<span class="badge-status down">Ошибка</span>';
        document.getElementById('ready-status').innerHTML = ready
          ? '<span class="badge-status up">Готов</span>' : '<span class="badge-status down">Не готов</span>';
        document.getElementById('api-version').textContent = health.version || '1.0.0';

        const upCount = (devices.items || []).filter(d => (d.status || '').toLowerCase() === 'up').length;
        document.getElementById('device-up').textContent = `${upCount}/${devices.total ?? devices.items?.length ?? 0}`;

        const statusCounts = { up: 0, down: 0, unknown: 0 };
        (devices.items || []).forEach((d) => {
          const s = (d.status || 'unknown').toLowerCase();
          if (s === 'up') statusCounts.up++;
          else if (s === 'down') statusCounts.down++;
          else statusCounts.unknown++;
        });

        Charts.doughnutChart('health-chart',
          ['В сети', 'Недоступны', 'Неизвестно'],
          [statusCounts.up, statusCounts.down, statusCounts.unknown],
          [Charts.COLORS.accent, Charts.COLORS.danger, Charts.COLORS.muted]
        );

        const jobStatus = {};
        (jobs || []).forEach((j) => {
          const label = App.STATUS_LABELS[(j.status || '').toLowerCase()] || j.status;
          jobStatus[label] = (jobStatus[label] || 0) + 1;
        });
        Charts.barChart('jobs-chart',
          Object.keys(jobStatus),
          [{ label: 'Задания', data: Object.values(jobStatus), backgroundColor: Charts.COLORS.infoDim, borderColor: Charts.COLORS.info, borderWidth: 1 }],
          { plugins: { legend: { display: false } } }
        );

        const metricsEl = document.getElementById('metrics-table');
        const sampleDevices = (devices.items || []).slice(0, 8);
        const metricsRows = await Promise.allSettled(
          sampleDevices.map(async (d) => {
            const m = await Api.getDeviceMetrics(d.id);
            return { device: d, metrics: m };
          })
        );

        const rows = metricsRows
          .filter((r) => r.status === 'fulfilled')
          .map((r) => r.value);

        if (!rows.length) {
          metricsEl.innerHTML = '<p class="empty-state">Метрики устройств недоступны.</p>';
        } else {
          metricsEl.innerHTML = `<table class="data-table"><thead><tr>
            <th>Устройство</th><th>CPU %</th><th>Память %</th><th>Аптайм</th><th>Последний опрос</th>
          </tr></thead><tbody>${rows.map(({ device, metrics }) => {
            const latest = metrics.latest || metrics.current || metrics;
            return `<tr>
              <td><a href="/pages/device-detail.html?id=${device.id}">${App.escapeHtml(device.hostname)}</a></td>
              <td class="mono">${latest.cpu_percent ?? latest.cpu ?? '—'}</td>
              <td class="mono">${latest.memory_percent ?? latest.memory ?? '—'}</td>
              <td class="mono">${latest.uptime_seconds ? Math.floor(latest.uptime_seconds / 86400) + ' дн.' : '—'}</td>
              <td>${App.formatDate(latest.timestamp || latest.polled_at)}</td>
            </tr>`;
          }).join('')}</tbody></table>`;
        }
      } catch (err) {
        App.showError(el, err.message);
      }
    });
  </script>
</body>
</html>
