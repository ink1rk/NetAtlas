<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=ui2">
  <script>
    try {
      var t = localStorage.getItem('netatlas_theme');
      var theme = t === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    }
  </script>

</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/i18n.js?v=ui2"></script>
  <script src="/js/api.js?v=ui2"></script>
  <script src="/js/auth.js?v=ui2"></script>
  <script src="/js/ui.js?v=ui2"></script>
  <script src="/js/app.js?v=ui2"></script>
  <script>
    let activeTab = 'all';
    let lastData = null;

    App.initShell('search', 'title.search', (el) => {
      el.innerHTML = `
        <div class="page-intro">
          <p class="subtitle">${I18n.t('search.type_hint')}</p>
        </div>
        <div class="panel mb-3">
          <div class="panel-body">
            <form id="search-form" class="search-form">
              <input type="search" id="search-q" class="form-control form-na" placeholder="${I18n.t('search.placeholder')}" autofocus>
              <button type="submit" class="btn-na btn-na-primary">${I18n.t('common.search')}</button>
            </form>
            <p class="form-hint mt-2 mb-2">${I18n.t('search.live')}</p>
            <div class="hint-row" id="recent-chips"></div>
          </div>
        </div>
        <div class="tab-bar" id="result-tabs" hidden>
          <button class="tab-btn active" data-tab="all">${I18n.t('search.all')}</button>
          <button class="tab-btn" data-tab="devices">${I18n.t('nav.devices')}</button>
          <button class="tab-btn" data-tab="interfaces">${I18n.t('device.tab_ifaces')}</button>
          <button class="tab-btn" data-tab="addresses">${I18n.t('ipam.addresses')}</button>
        </div>
        <div id="search-results"><p class="empty-state">${I18n.t('search.hint')}</p></div>
      `;

      renderRecent();
      const input = document.getElementById('search-q');
      Ui.attachAutocomplete(input, {
        minChars: 1,
        getSuggestions: async (q) => {
          const data = await Api.searchSuggest(q, 8);
          return (data.suggestions || []).map((s) => ({
            value: s.label, label: s.label, subtitle: s.subtitle, href: s.href,
          }));
        },
        onSelect: (it) => {
          if (it.href) {
            Ui.pushRecent('search', it.label || it.value);
            window.location.href = it.href;
            return;
          }
          input.value = it.value || it.label;
          submitSearch();
        },
        emptySuggestions: async () => Ui.loadRecent('search').map((v) => ({
          value: v, label: v, subtitle: I18n.t('search.recent'),
        })),
      });

      const live = Ui.debounce(() => {
        const q = input.value.trim();
        if (q.length >= 2) runSearch(q, false);
      }, 350);
      input.addEventListener('input', live);

      document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        submitSearch();
      });
      document.getElementById('result-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-tab]');
        if (!btn || !lastData) return;
        activeTab = btn.dataset.tab;
        document.querySelectorAll('#result-tabs .tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
        renderResults(input.value.trim(), lastData);
      });

      const q = App.queryParam('q');
      if (q) {
        input.value = q;
        runSearch(q, true);
      }
    });

    function renderRecent() {
      const host = document.getElementById('recent-chips');
      const items = Ui.loadRecent('search');
      if (!items.length) { host.innerHTML = ''; return; }
      Ui.hintChips(host, items.map((v) => ({ value: v, label: v })), (value) => {
        document.getElementById('search-q').value = value;
        submitSearch();
      });
    }

    function submitSearch() {
      const query = document.getElementById('search-q').value.trim();
      if (!query) return;
      history.replaceState(null, '', `?q=${encodeURIComponent(query)}`);
      runSearch(query, true);
    }

    function pluralResults(n) {
      if (I18n.lang() === 'en') return I18n.t(n === 1 ? 'search.result_one' : 'search.result_many', { n });
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return I18n.t('search.result_one', { n });
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return I18n.t('search.result_few', { n });
      return I18n.t('search.result_many', { n });
    }

    async function runSearch(q, pushHistory) {
      const el = document.getElementById('search-results');
      el.innerHTML = `<p class="empty-state">${I18n.t('search.searching')}</p>`;
      try {
        const data = await Api.search(q);
        lastData = data;
        if (pushHistory) {
          Ui.pushRecent('search', q);
          renderRecent();
        }
        const total = (data.devices || []).length + (data.interfaces || []).length + (data.addresses || []).length;
        document.getElementById('result-tabs').hidden = total === 0;
        renderResults(q, data);
      } catch (err) {
        document.getElementById('result-tabs').hidden = true;
        el.innerHTML = `<div class="alert-na error">${App.escapeHtml(err.message)}</div>`;
      }
    }

    function renderResults(q, data) {
      const el = document.getElementById('search-results');
      const devices = data.devices || [];
      const interfaces = data.interfaces || [];
      const addresses = data.addresses || [];
      const showDevices = activeTab === 'all' || activeTab === 'devices';
      const showIfaces = activeTab === 'all' || activeTab === 'interfaces';
      const showAddrs = activeTab === 'all' || activeTab === 'addresses';
      const total = devices.length + interfaces.length + addresses.length;
      if (!total) {
        el.innerHTML = `<p class="empty-state">${I18n.t('search.no_results', { q: App.escapeHtml(q) })}</p>`;
        return;
      }
      el.innerHTML = `
        <p class="text-muted mb-3">${pluralResults(total)} — «<strong>${App.escapeHtml(q)}</strong>»</p>
        ${showDevices && devices.length ? `<div class="search-hit-group panel mb-3"><div class="panel-header"><h3>${I18n.t('search.devices', { n: devices.length })}</h3></div><div class="panel-body p-0">
          ${devices.map(d => `<a href="/pages/device-detail.html?id=${d.id}" class="search-hit d-block text-decoration-none">
            <div><strong>${Ui.highlight(d.hostname, q)}</strong> <span class="mono text-muted">${Ui.highlight(d.management_ip, q)}</span> ${App.statusBadge(d.status)}</div>
            <span class="text-muted">${App.escapeHtml([d.vendor, d.model, d.platform].filter(Boolean).join(' · '))}</span>
          </a>`).join('')}
        </div></div>` : ''}
        ${showIfaces && interfaces.length ? `<div class="search-hit-group panel mb-3"><div class="panel-header"><h3>${I18n.t('search.interfaces', { n: interfaces.length })}</h3></div><div class="panel-body p-0">
          ${interfaces.map(i => `<a class="search-hit d-block text-decoration-none" href="${i.device_id ? `/pages/device-detail.html?id=${i.device_id}` : '#'}">
            <div><span class="mono"><strong>${Ui.highlight(i.name, q)}</strong></span> ${App.escapeHtml(i.description || '')}</div>
            <span class="mono text-muted">${App.escapeHtml(i.mac || '')}</span>
          </a>`).join('')}
        </div></div>` : ''}
        ${showAddrs && addresses.length ? `<div class="search-hit-group panel mb-3"><div class="panel-header"><h3>${I18n.t('search.addresses', { n: addresses.length })}</h3></div><div class="panel-body p-0">
          ${addresses.map(a => `<div class="search-hit">
            <div class="mono"><strong>${Ui.highlight(a.address, q)}</strong> ${Ui.highlight(a.hostname || '', q)}</div>
            <span class="text-muted">${App.statusBadge(a.status)} ${a.is_conflict ? '· ' + I18n.t('search.conflict') : ''}</span>
          </div>`).join('')}
        </div></div>` : ''}
      `;
    }
  </script>
</body>
</html>
