<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAtlas</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css?v=mon3">
  <link rel="stylesheet" href="/css/discovery.css?v=mon3">
  <script>
    try {
      var t = localStorage.getItem('netatlas_theme');
      var theme = t === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    }
  </script>
</head>
<body>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/chartjs/chart.umd.min.js"></script>
  <script src="/js/i18n.js?v=mon3"></script>
  <script src="/js/api.js?v=mon3"></script>
  <script src="/js/auth.js?v=mon3"></script>
  <script src="/js/charts.js?v=mon3"></script>
  <script src="/js/ui.js?v=mon3"></script>
  <script src="/js/app.js?v=mon3"></script>
  <script>
    const deviceId = App.queryParam('id');
    if (!deviceId) window.location.href = '/pages/devices.html';

    App.initShell('devices', 'title.device_detail', async (el) => {
      el.innerHTML = `<p class="empty-state">${I18n.t('device.loading')}</p>`;
      try {
        const device = await Api.getDevice(deviceId);
        document.querySelector('.topbar-title').textContent = device.hostname || I18n.t('title.device_detail');
        el.innerHTML = `
          <div class="stat-grid">
            <div class="stat-block"><div class="stat-value mono" style="font-size:1.1rem">${App.escapeHtml(device.management_ip)}</div><div class="stat-label">${I18n.t('devices.mgmt_ip')}</div></div>
            <div class="stat-block"><div class="stat-value">${App.escapeHtml(device.vendor)}</div><div class="stat-label">${I18n.t('common.vendor')}</div></div>
            <div class="stat-block"><div class="stat-value">${App.escapeHtml(device.model)}</div><div class="stat-label">${I18n.t('common.model')}</div></div>
            <div class="stat-block accent"><div class="stat-value">${App.statusBadge(device.status)}</div><div class="stat-label">${I18n.t('common.status')}</div></div>
          </div>
          <div class="panel">
            <div class="panel-header"><h3>${App.escapeHtml(device.hostname)}</h3>
              <a href="/pages/devices.html" class="btn-na">${I18n.t('device.back')}</a>
            </div>
            <div class="panel-body">
              <div class="row mb-3">
                <div class="col-md-3"><small class="text-muted">${I18n.t('device.serial')}</small><div class="mono">${App.escapeHtml(device.serial)}</div></div>
                <div class="col-md-3"><small class="text-muted">${I18n.t('device.firmware')}</small><div class="mono">${App.escapeHtml(device.firmware)}</div></div>
                <div class="col-md-3"><small class="text-muted">${I18n.t('device.os')}</small><div class="mono">${App.escapeHtml(device.os_version)}</div></div>
                <div class="col-md-3"><small class="text-muted">${I18n.t('device.last_seen')}</small><div>${App.formatDate(device.last_seen_at)}</div></div>
              </div>
              <div class="tab-bar">
                <button class="tab-btn active" data-tab="interfaces">${I18n.t('device.tab_ifaces')}</button>
                <button class="tab-btn" data-tab="neighbors">${I18n.t('device.tab_neighbors')}</button>
                <button class="tab-btn" data-tab="adjacency">${I18n.t('device.tab_adjacency')}</button>
                <button class="tab-btn" data-tab="metrics">${I18n.t('device.tab_metrics')}</button>
                <button class="tab-btn" data-tab="credentials">${I18n.t('device.tab_credentials')}</button>
                ${String(device.platform || '').toLowerCase() === 'mikrotik' ? `<button class="tab-btn" data-tab="bridge">${I18n.t('bridge.title')}</button>` : ''}
                ${(device.attributes || {}).device_class === 'printer' ? `<button class="tab-btn" data-tab="printer">${I18n.t('printer.title')}</button>` : ''}
              </div>
              <div id="tab-content"><p class="empty-state">${I18n.t('common.loading')}</p></div>
            </div>
          </div>
        `;
        const tabs = el.querySelectorAll('.tab-btn');
        tabs.forEach((btn) => btn.addEventListener('click', () => {
          tabs.forEach((t) => t.classList.remove('active'));
          btn.classList.add('active');
          loadTab(btn.dataset.tab, el);
        }));
        loadTab(App.queryParam('tab') || 'interfaces', el);
      } catch (err) {
        App.showError(el, err.message);
      }
    });

    async function loadTab(tab, el) {
      const content = el.querySelector('#tab-content');
      content.innerHTML = `<p class="empty-state">${I18n.t('common.loading')}</p>`;
      try {
        if (tab === 'interfaces') {
          const ifaces = await Api.getDeviceInterfaces(deviceId);
          if (!ifaces?.length) { content.innerHTML = `<p class="empty-state">${I18n.t('device.no_ifaces')}</p>`; return; }
          content.innerHTML = `<table class="data-table"><thead><tr>
            <th>${I18n.t('device.iface_name')}</th><th>Admin</th><th>Oper</th><th>${I18n.t('device.speed')}</th><th>MAC</th><th>MTU</th><th>Trunk</th>
          </tr></thead><tbody>${ifaces.map(i => `<tr>
            <td class="mono"><strong>${App.escapeHtml(i.name)}</strong></td>
            <td>${App.statusBadge(i.admin_status)}</td>
            <td>${App.statusBadge(i.oper_status)}</td>
            <td>${App.formatBps(i.speed_bps)}</td>
            <td class="mono">${App.escapeHtml(i.mac)}</td>
            <td>${i.mtu || '—'}</td>
            <td>${i.is_trunk ? I18n.t('common.yes') : I18n.t('common.no')}</td>
          </tr>`).join('')}</tbody></table>`;
        } else if (tab === 'neighbors') {
          const neighbors = await Api.getDeviceNeighbors(deviceId);
          if (!neighbors?.length) { content.innerHTML = `<p class="empty-state">${I18n.t('device.no_neighbors')}</p>`; return; }
          content.innerHTML = `<table class="data-table"><thead><tr>
            <th>${I18n.t('device.local_iface')}</th><th>${I18n.t('device.remote_device')}</th><th>${I18n.t('device.remote_iface')}</th><th>${I18n.t('device.protocol')}</th>
          </tr></thead><tbody>${neighbors.map(n => `<tr>
            <td class="mono">${App.escapeHtml(n.local_interface || n.interface)}</td>
            <td>${App.escapeHtml(n.remote_hostname || n.hostname)}</td>
            <td class="mono">${App.escapeHtml(n.remote_interface)}</td>
            <td>${App.escapeHtml(n.protocol || 'LLDP')}</td>
          </tr>`).join('')}</tbody></table>`;
        } else if (tab === 'metrics') {
          const from = new Date(Date.now() - 24 * 3600e3).toISOString();
          const [metrics, pollLogs] = await Promise.all([
            Api.getDeviceMetrics(deviceId, { from, limit: 1500, keys: 'cpu_percent,memory_percent,temperature_c,if_in_bps,if_out_bps' }),
            Api.getDevicePollLogs(deviceId, { limit: 20 }).catch(() => ({ items: [] })),
          ]);
          const history = metrics.history || metrics.items || [];
          const latest = metrics.latest || history[history.length - 1];
          if (!history.length) {
            content.innerHTML = `
              <p class="empty-state">${I18n.t('device.no_metrics')}</p>
              <p class="form-hint">${I18n.t('device.no_creds')}</p>
              <button class="btn-na btn-na-primary" id="btn-poll">${I18n.t('cred.collect_now')}</button>
            `;
            document.getElementById('btn-poll')?.addEventListener('click', async () => {
              try { await Api.collectMetricsNow(); Ui.toast(I18n.t('cred.collect_ok'), 'ok'); }
              catch (err) { Ui.toast(err.message, 'error'); }
            });
            return;
          }
          const uptime = latest?.uptime_seconds ?? latest?.extras?.uptime_seconds;
          const lastPoll = (pollLogs.items || [])[0];
          const snmpDead = lastPoll && (lastPoll.status === 'error' || /SNMP no response/i.test(lastPoll.message || ''));
          const ifDown = latest?.interfaces_down ?? latest?.extras?.interfaces_down;
          const ifErr = latest?.if_in_errors ?? latest?.extras?.if_in_errors;
          content.innerHTML = `
            ${snmpDead ? `<div class="alert alert-warning py-2 mb-3">${I18n.t('mon.snmp_dead_hint')}</div>` : ''}
            <div class="row g-2 mb-3">
              <div class="col-md-2"><div class="stat-block"><div class="stat-value">${latest?.cpu_percent ?? '—'}</div><div class="stat-label">CPU %</div></div></div>
              <div class="col-md-2"><div class="stat-block"><div class="stat-value">${latest?.memory_percent ?? '—'}</div><div class="stat-label">Memory %</div></div></div>
              <div class="col-md-2"><div class="stat-block"><div class="stat-value">${latest?.temperature_c ?? '—'}</div><div class="stat-label">${I18n.t('mon.temp')}</div></div></div>
              <div class="col-md-2"><div class="stat-block"><div class="stat-value">${ifDown != null ? ifDown : '—'}</div><div class="stat-label">IF down</div></div></div>
              <div class="col-md-2"><div class="stat-block"><div class="stat-value">${ifErr != null ? ifErr : '—'}</div><div class="stat-label">IF err in</div></div></div>
              <div class="col-md-2"><div class="stat-block"><div class="stat-value">${uptime ?? '—'}</div><div class="stat-label">Uptime s</div></div></div>
            </div>
            <div class="chart-wrap tall mb-3"><canvas id="metrics-chart"></canvas></div>
            <div class="chart-wrap tall mb-3"><canvas id="metrics-traffic"></canvas></div>
            <button class="btn-na btn-na-secondary mb-3" id="btn-poll">${I18n.t('cred.collect_now')}</button>
            <h4 class="mb-2">${I18n.t('mon.poll_log_title')}</h4>
            <div id="device-poll-logs"></div>
          `;
          const cpuSeries = metrics.series?.cpu_percent || [];
          const memSeries = metrics.series?.memory_percent || [];
          Charts.destroyAll();
          const chartHost = document.getElementById('metrics-chart')?.parentElement;
          if (!cpuSeries.length && !memSeries.length) {
            if (chartHost) {
              chartHost.innerHTML = `<p class="empty-state">${I18n.t('mon.empty_core_metrics')}</p>`;
            }
          } else {
            const labels = (cpuSeries.length ? cpuSeries : memSeries).map((h) => App.formatDate(h.t));
            Charts.lineChart('metrics-chart', labels, [
              { label: I18n.t('device.cpu'), data: cpuSeries.map((p) => p.v), borderColor: Charts.COLORS.accent, backgroundColor: Charts.COLORS.accentDim, tension: 0.3, fill: true, pointRadius: 0 },
              { label: I18n.t('device.memory'), data: memSeries.map((p) => p.v), borderColor: Charts.COLORS.info, backgroundColor: Charts.COLORS.infoDim, tension: 0.3, fill: true, pointRadius: 0 },
            ]);
          }
          const tin = metrics.series?.if_in_bps || [];
          const tout = metrics.series?.if_out_bps || [];
          const trafficHost = document.getElementById('metrics-traffic')?.parentElement;
          if (!tin.length && !tout.length) {
            if (trafficHost) trafficHost.innerHTML = `<p class="empty-state text-secondary">${I18n.t('mon.no_traffic_yet')}</p>`;
          } else {
            const tlabels = (tin.length ? tin : tout).map((p) => App.formatDate(p.t));
            Charts.lineChart('metrics-traffic', tlabels, [
              { label: 'in bps', data: tin.map((p) => p.v), borderColor: Charts.COLORS.success, backgroundColor: Charts.COLORS.successDim, tension: 0.25, fill: true, pointRadius: 0 },
              { label: 'out bps', data: tout.map((p) => p.v), borderColor: Charts.COLORS.warning, backgroundColor: Charts.COLORS.warningDim, tension: 0.25, fill: true, pointRadius: 0 },
            ]);
          }
          const logsEl = document.getElementById('device-poll-logs');
          const logs = pollLogs.items || [];
          logsEl.innerHTML = logs.length
            ? `<table class="data-table"><thead><tr><th>${I18n.t('mon.started')}</th><th>${I18n.t('mon.status')}</th><th>${I18n.t('mon.phase')}</th><th>${I18n.t('mon.duration')}</th><th>${I18n.t('mon.message')}</th></tr></thead><tbody>
              ${logs.map((r) => `<tr>
                <td>${App.formatDate(r.started_at)}</td>
                <td><span class="badge-status ${r.status === 'ok' ? 'up' : (r.status === 'error' ? 'down' : '')}">${App.escapeHtml(r.status || '—')}</span></td>
                <td class="mono">${App.escapeHtml(r.phase || '—')}</td>
                <td class="mono">${r.duration_ms != null ? r.duration_ms + ' ms' : '—'}</td>
                <td class="msg-cell">${App.escapeHtml(r.message || r.error || '—')}</td>
              </tr>`).join('')}
            </tbody></table>`
            : `<p class="empty-state">${I18n.t('mon.no_poll_logs')}</p>`;
          document.getElementById('btn-poll')?.addEventListener('click', async () => {
            try {
              const stats = await Api.collectMetricsNow();
              Ui.toast(`${I18n.t('cred.collect_ok')}: ok=${stats.ok ?? 0}, err=${stats.errors ?? 0}`, 'ok');
              // Reload whole page so last_seen / interfaces header refresh after enrich.
              setTimeout(() => { window.location.reload(); }, 800);
            } catch (err) { Ui.toast(err.message, 'error'); }
          });
        } else if (tab === 'adjacency') {
          const [fdb, arp, routes] = await Promise.all([
            Api.getDeviceFdb(deviceId).catch(() => []),
            Api.getDeviceArp(deviceId).catch(() => []),
            Api.getDeviceRoutes(deviceId).catch(() => []),
          ]);
          content.innerHTML = `
            <h4 class="mb-2">FDB (${fdb.length})</h4>
            ${fdb.length ? `<table class="data-table mb-4"><thead><tr><th>MAC</th><th>VLAN</th><th>${I18n.t('device.local_iface')}</th></tr></thead><tbody>
              ${fdb.slice(0, 100).map((f) => `<tr><td class="mono">${App.escapeHtml(f.mac)}</td><td>${f.vlan_id ?? '—'}</td><td class="mono">${App.escapeHtml(f.interface)}</td></tr>`).join('')}
            </tbody></table>` : `<p class="empty-state mb-4">${I18n.t('noc.empty')}</p>`}
            <h4 class="mb-2">ARP (${arp.length})</h4>
            ${arp.length ? `<table class="data-table mb-4"><thead><tr><th>IP</th><th>MAC</th><th>${I18n.t('device.local_iface')}</th></tr></thead><tbody>
              ${arp.slice(0, 100).map((a) => `<tr><td class="mono">${App.escapeHtml(a.ip)}</td><td class="mono">${App.escapeHtml(a.mac)}</td><td class="mono">${App.escapeHtml(a.interface || '—')}</td></tr>`).join('')}
            </tbody></table>` : `<p class="empty-state mb-4">${I18n.t('noc.empty')}</p>`}
            <h4 class="mb-2">${I18n.t('nav.ipam')} · Routes (${routes.length})</h4>
            ${routes.length ? `<table class="data-table"><thead><tr><th>Destination</th><th>Next hop</th><th>${I18n.t('device.local_iface')}</th><th>Protocol</th></tr></thead><tbody>
              ${routes.slice(0, 100).map((r) => `<tr><td class="mono">${App.escapeHtml(r.destination)}</td><td class="mono">${App.escapeHtml(r.next_hop || '—')}</td><td class="mono">${App.escapeHtml(r.interface || '—')}</td><td>${App.escapeHtml(r.protocol || '—')}</td></tr>`).join('')}
            </tbody></table>` : `<p class="empty-state">${I18n.t('noc.empty')}</p>`}
          `;
        } else if (tab === 'bridge') {
          const bridge = await Api.getDeviceBridge(deviceId);
          if (!bridge.supported) { content.innerHTML = `<p class="empty-state">${I18n.t('noc.empty')}</p>`; return; }
          content.innerHTML = `
            ${(bridge.bridges || []).map((b) => `<p class="form-hint">${App.escapeHtml(b.name)} · RSTP: ${App.escapeHtml(b.rstp)} · VLAN filtering: ${b.vlan_filtering ? 'on' : 'off'}</p>`).join('')}
            <table class="data-table"><thead><tr><th>${I18n.t('bridge.port')}</th><th>${I18n.t('bridge.pvid')}</th><th>Horizon</th><th>${I18n.t('bridge.tagged')}</th></tr></thead><tbody>
              ${(bridge.ports || []).map((p) => {
                const tagged = (bridge.vlan_table || []).filter((v) => (v.tagged || []).includes(p.interface)).map((v) => v.vlan_id);
                return `<tr><td class="mono">${App.escapeHtml(p.interface)}</td><td>${p.pvid ?? '—'}</td><td>${App.escapeHtml(p.horizon || '—')}</td><td class="mono">${App.escapeHtml(tagged.join(', ') || '—')}</td></tr>`;
              }).join('')}
            </tbody></table>
          `;
        } else if (tab === 'printer') {
          const p = await Api.getDevicePrinter(deviceId);
          const toner = [
            ['Black', p.black_toner_percent], ['Cyan', p.cyan_toner_percent],
            ['Magenta', p.magenta_toner_percent], ['Yellow', p.yellow_toner_percent], ['Waste', p.waste_toner_percent],
          ].filter(([, v]) => typeof v === 'number');
          content.innerHTML = `
            <div class="row g-2 mb-3">
              <div class="col-md-3"><div class="stat-block"><div class="stat-value">${App.escapeHtml(p.status || '—')}</div><div class="stat-label">${I18n.t('printer.status')}</div></div></div>
              <div class="col-md-3"><div class="stat-block"><div class="stat-value">${p.total_pages ?? '—'}</div><div class="stat-label">${I18n.t('printer.total_pages')}</div></div></div>
              <div class="col-md-3"><div class="stat-block"><div class="stat-value">${p.paper_empty ? I18n.t('printer.paper_empty') : I18n.t('printer.paper_ok')}</div><div class="stat-label">${I18n.t('printer.paper')}</div></div></div>
            </div>
            <div class="row g-2">
              ${toner.map(([label, v]) => `<div class="col-md-2"><div class="stat-block ${v < 10 ? 'accent' : ''}"><div class="stat-value">${Math.round(v)}%</div><div class="stat-label">${App.escapeHtml(label)}</div></div></div>`).join('')}
            </div>
            ${(p.errors || []).length ? `<div class="alert-na error mt-3">${App.escapeHtml((p.errors || []).join(', '))}</div>` : ''}
          `;
        } else if (tab === 'credentials') {
          const [linked, all] = await Promise.all([
            Api.getDeviceCredentials(deviceId),
            Api.listCredentials().catch(() => []),
          ]);
          const selected = new Set((linked.items || []).map((i) => i.credential_profile_id));
          if (!all.length) {
            content.innerHTML = `<p class="empty-state">${I18n.t('disc.cred_none')}</p><a class="btn-na btn-na-primary" href="/pages/credentials.html">${I18n.t('nav.credentials')}</a>`;
            return;
          }
          content.innerHTML = `
            <p class="form-hint mb-3">${I18n.t('device.no_creds')}</p>
            <div class="disc-seed-list mb-3">
              ${all.map((c) => `
                <label class="disc-seed" style="cursor:pointer">
                  <span class="disc-seed__main">
                    <input type="checkbox" class="dev-cred-check" value="${App.escapeHtml(c.id)}" ${selected.has(c.id) ? 'checked' : ''}>
                    <span>
                      <div class="disc-seed__cidr">${App.escapeHtml(c.name)}</div>
                      <div class="disc-seed__label">${App.escapeHtml(c.protocol)}</div>
                    </span>
                  </span>
                </label>
              `).join('')}
            </div>
            <button class="btn-na btn-na-primary" id="btn-save-creds">${I18n.t('device.cred_save')}</button>
          `;
          document.getElementById('btn-save-creds')?.addEventListener('click', async () => {
            const ids = [...content.querySelectorAll('.dev-cred-check:checked')].map((el) => el.value);
            try {
              await Api.setDeviceCredentials(deviceId, { credential_profile_ids: ids });
              Ui.toast(I18n.t('device.cred_saved'), 'ok');
            } catch (err) { Ui.toast(err.message, 'error'); }
          });
        }
      } catch (err) {
        content.innerHTML = `<div class="alert-na error">${App.escapeHtml(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
