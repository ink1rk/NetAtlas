services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netatlas
      POSTGRES_USER: netatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netatlas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netatlas -d netatlas"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: netatlas
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-netatlas}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    image: ghcr.io/ink1rk/netatlas-api:1.0.0
    env_file:
      - .env
    environment:
      NETATLAS_DATABASE_URL: postgresql+asyncpg://netatlas:${POSTGRES_PASSWORD:-netatlas}@postgres:5432/netatlas
      NETATLAS_DATABASE_URL_SYNC: postgresql+psycopg://netatlas:${POSTGRES_PASSWORD:-netatlas}@postgres:5432/netatlas
      NETATLAS_REDIS_URL: redis://redis:6379/0
      NETATLAS_RABBITMQ_URL: amqp://netatlas:${RABBITMQ_PASSWORD:-netatlas}@rabbitmq:5672//
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    image: ghcr.io/ink1rk/netatlas-api:1.0.0
    command: ["celery", "-A", "netatlas.workers.celery_app.celery_app", "worker", "-Q", "discovery,metrics,export,maintenance", "-l", "INFO"]
    env_file:
      - .env
    environment:
      NETATLAS_DATABASE_URL: postgresql+asyncpg://netatlas:${POSTGRES_PASSWORD:-netatlas}@postgres:5432/netatlas
      NETATLAS_DATABASE_URL_SYNC: postgresql+psycopg://netatlas:${POSTGRES_PASSWORD:-netatlas}@postgres:5432/netatlas
      NETATLAS_REDIS_URL: redis://redis:6379/0
      NETATLAS_RABBITMQ_URL: amqp://netatlas:${RABBITMQ_PASSWORD:-netatlas}@rabbitmq:5672//
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: ghcr.io/ink1rk/netatlas-api:1.0.0
    command: ["celery", "-A", "netatlas.workers.celery_app.celery_app", "beat", "-l", "INFO"]
    env_file:
      - .env
    environment:
      NETATLAS_DATABASE_URL: postgresql+asyncpg://netatlas:${POSTGRES_PASSWORD:-netatlas}@postgres:5432/netatlas
      NETATLAS_REDIS_URL: redis://redis:6379/0
      NETATLAS_RABBITMQ_URL: amqp://netatlas:${RABBITMQ_PASSWORD:-netatlas}@rabbitmq:5672//
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/ink1rk/netatlas-frontend:1.0.0
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NETATLAS_HTTPS_PORT:-443}:443"
      - "${NETATLAS_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/netatlas.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NETATLAS_TLS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
